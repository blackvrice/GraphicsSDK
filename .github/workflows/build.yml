name: Build and correctness
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows
      - run: cmake --build --preset windows-release
      # Hosted runners do not provide hardware/GBV acceptance. Keep the strict WARP
      # memory smoke; execute the full unexcluded GPU matrix on a GPU-equipped host.
      - run: ctest --preset windows-release --exclude-regex "^memory_reclamation_(gpu|validation)$"
      - run: cmake --install out/core --config Release --prefix out/install
      - run: python tools/audit_licenses.py --profile sdk --output out/license-audit
      - shell: pwsh
        run: |
          cmake -S tests/consumer -B out/consumer -A x64 "-DCMAKE_PREFIX_PATH=$pwd/out/install"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/consumer --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./out/consumer/Release/consumer.exe
      - run: python tools/check_python_contracts.py --output out/python-contracts
      - run: python tools/check_vulkan_competitors.py
      - run: python tools/check_llgl_transfer_profile.py
      - run: python tools/check_llgl_draw_profile.py
      - run: python tools/check_llgl_pso_profile.py
      - run: python tools/check_llgl_allocation_profile.py
      - name: Independently replay LLGL resource lifecycle and full payloads
        run: python benchmarks/reports/validation/2026-10-29-phase3-llgl-allocation/verify.py
      - name: Independently replay LLGL PSO lifecycle observations
        run: python benchmarks/reports/validation/2026-10-28-phase3-llgl-pso/verify.py
      - name: Independently replay LLGL draw native observations
        run: python benchmarks/reports/validation/2026-10-28-phase3-llgl-draw/verify.py
      - name: Independently replay LLGL upload defect and explicit patch profile
        run: python benchmarks/reports/validation/2026-10-28-phase3-llgl-upload/verify.py
      - name: Independently replay saved LLGL Vulkan probe evidence
        run: python benchmarks/reports/validation/2026-10-28-phase3-llgl-vulkan/verify.py
      - name: Independently replay saved current draw evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-draw/verify.py') != '' }}
        run: python benchmarks/reports/validation/2026-10-27-phase3-current-draw/verify.py
      - name: Independently replay saved current PSO evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-pso/verify.py') != '' }}
        run: python benchmarks/reports/validation/2026-10-27-phase3-current-pso/verify.py
      - name: Independently replay saved current resource evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-allocation/verify.py') != '' }}
        run: python benchmarks/reports/validation/2026-10-27-phase3-current-allocation/verify.py
      - name: Independently replay saved Linux software probe evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-linux-comparison-probe/verify.py') != '' }}
        run: python benchmarks/reports/validation/2026-10-27-phase3-linux-comparison-probe/verify.py
      - name: Independently replay saved Linux workload preparation evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-28-phase3-linux-workloads/verify.py') != '' }}
        run: python benchmarks/reports/validation/2026-10-28-phase3-linux-workloads/verify.py
      - name: Preserve complete Python contracts and checkout identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-contracts-windows-${{ github.sha }}
          path: out/python-contracts/
          if-no-files-found: error
          retention-days: 14
  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - run: cmake --preset portable-core -DCMAKE_CXX_COMPILER=g++-14
      - run: cmake --build --preset portable-core
      - run: ctest --preset portable-core
      - run: python3 tools/check_python_contracts.py --output out/python-contracts
      - run: python3 tools/check_vulkan_competitors.py
      - run: python3 tools/check_llgl_transfer_profile.py
      - run: python3 tools/check_llgl_draw_profile.py
      - run: python3 tools/check_llgl_pso_profile.py
      - run: python3 tools/check_llgl_allocation_profile.py
      - name: Independently replay LLGL resource lifecycle and full payloads
        run: python3 benchmarks/reports/validation/2026-10-29-phase3-llgl-allocation/verify.py
      - name: Independently replay LLGL PSO lifecycle observations
        run: python3 benchmarks/reports/validation/2026-10-28-phase3-llgl-pso/verify.py
      - name: Independently replay LLGL draw native observations
        run: python3 benchmarks/reports/validation/2026-10-28-phase3-llgl-draw/verify.py
      - name: Independently replay LLGL upload defect and explicit patch profile
        run: python3 benchmarks/reports/validation/2026-10-28-phase3-llgl-upload/verify.py
      - name: Independently replay saved LLGL Vulkan probe evidence
        run: python3 benchmarks/reports/validation/2026-10-28-phase3-llgl-vulkan/verify.py
      - name: Independently replay saved current draw evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-draw/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-10-27-phase3-current-draw/verify.py
      - name: Independently replay saved current PSO evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-pso/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-10-27-phase3-current-pso/verify.py
      - name: Independently replay saved current resource evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-current-allocation/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-10-27-phase3-current-allocation/verify.py
      - name: Independently replay saved Linux software probe evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-27-phase3-linux-comparison-probe/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-10-27-phase3-linux-comparison-probe/verify.py
      - name: Independently replay saved Linux workload preparation evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-10-28-phase3-linux-workloads/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-10-28-phase3-linux-workloads/verify.py
      - name: Preserve complete Python contracts and checkout identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-contracts-linux-${{ github.sha }}
          path: out/python-contracts/
          if-no-files-found: error
          retention-days: 14
