name: Linux XCB manual display preparation
on:
  push:
    paths: ['include/**','src/**','CMakeLists.txt','tests/BgraSupport.hpp','tests/fixtures/SpirvFixtures.hpp','tests/linux_xcb_manual/**','tests/linux_xcb_surface/**','tests/linux_vulkan_device/**','examples/xcb_presentation/**','examples/presentation/PresentationPolicy.hpp','tools/linux_xcb_manual.py','tools/xcb_window_manager.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','tools/vulkan-validation.lock.json','.github/workflows/linux-xcb-manual.yml']
  pull_request:
    paths: ['include/**','src/**','CMakeLists.txt','tests/BgraSupport.hpp','tests/fixtures/SpirvFixtures.hpp','tests/linux_xcb_manual/**','tests/linux_xcb_surface/**','tests/linux_vulkan_device/**','examples/xcb_presentation/**','examples/presentation/PresentationPolicy.hpp','tools/linux_xcb_manual.py','tools/xcb_window_manager.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','tools/vulkan-validation.lock.json','.github/workflows/linux-xcb-manual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        validation: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build pkg-config libxcb1-dev libvulkan1 mesa-vulkan-drivers xvfb xauth openbox
      - name: Build pinned XCB validation runtime
        if: matrix.validation
        run: python3 tools/prepare_linux_validation.py --xcb
      - run: cmake -S . -B out/manual-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DGFX_ENABLE_D3D12=OFF -DGFX_ENABLE_VULKAN=ON -DGFX_VULKAN_XCB=ON -DGFX_BUILD_TESTS=OFF -DGFX_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/manual-install"
      - run: cmake --build out/manual-sdk --parallel 1 && cmake --install out/manual-sdk
      - run: cmake -S tests/linux_xcb_manual -B out/manual-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/out/manual-install" && cmake --build out/manual-consumer --parallel 1
      - name: Software-only bounded animation and review binding smoke
        env:
          REQUIRE_VALIDATION: ${{ matrix.validation }}
        shell: bash
        run: |
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json')
          test "${#icds[@]}" -eq 1
          flags=()
          if test "$REQUIRE_VALIDATION" = true; then
            layer=$(python3 -c 'import json;from pathlib import Path;r=json.load(open("out/linux-xcb-validation-evidence/runtime/receipt.json"));print(Path(r["layer_manifest"]["path"]).parent)')
            flags+=(--validation-dir "$layer")
          fi
          python3 tools/linux_xcb_manual.py smoke --binary out/manual-consumer/gfx_xcb_manual --proxy out/manual-consumer/proxy/libvulkan.so.1 --identity-binary out/manual-consumer/identity/gfx_linux_vulkan_device --sdk-library out/manual-install/lib/libGraphicsSDKCore.a --icd "${icds[0]}" --software --output out/manual-evidence "${flags[@]}"
          python3 tools/linux_xcb_manual.py check --output out/manual-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-xcb-manual-ready-${{ matrix.validation }}
          path: |
            out/manual-evidence
            out/linux-xcb-validation-evidence
          if-no-files-found: warn
