name: Linux comparison probe (software diagnostic)
on:
  push:
    paths: ['.github/workflows/linux-comparison-probe.yml', 'benchmarks/linux_comparison/**', 'benchmarks/common/LinuxEnvironment.hpp', 'tools/linux_comparison.py', 'tests/test_linux_comparison.py', 'benchmarks/linux_workloads/**', 'tools/linux_workloads.py', 'tools/port_linux_benchmarks.py', 'tests/test_linux_workloads.py', 'tools/linux_workload_matrix.py', 'tests/test_linux_workload_matrix.py', 'benchmarks/linux_llgl_probe/**', 'tools/linux_llgl_probe.py', 'tests/test_linux_llgl_probe.py', 'benchmarks/linux_llgl_upload/**', 'tools/linux_llgl_upload.py', 'tools/port_linux_llgl_upload.py', 'tests/test_linux_llgl_upload.py', 'benchmarks/linux_llgl_draw/**', 'tools/linux_llgl_draw.py', 'tools/port_linux_llgl_draw.py', 'tests/test_linux_llgl_draw.py', 'benchmarks/linux_llgl_pso/**', 'tools/linux_llgl_pso.py', 'tools/port_linux_llgl_pso.py', 'tests/test_linux_llgl_pso.py', 'benchmarks/llgl_vulkan_*/**', 'benchmarks/vulkan_pso/Frame.hpp', 'benchmarks/phase3_comparison/pso.json', 'benchmarks/linux_llgl_allocation/**', 'tools/linux_llgl_allocation.py', 'tools/port_linux_llgl_allocation.py', 'tests/test_linux_llgl_allocation.py', 'benchmarks/vulkan_allocation/Payload.hpp', 'benchmarks/phase3_comparison/allocation.json', 'tools/linux_readiness_report.py', 'tests/test_linux_readiness_report.py', 'tools/linux_llgl_workload_mode.py', 'tests/test_linux_llgl_workload_mode.py', 'benchmarks/linux_upload_campaign/**', 'tools/linux_upload_campaign.py', 'tools/port_linux_upload_campaign.py', 'tests/test_linux_upload_campaign.py', 'benchmarks/phase3_comparison/linux-upload-campaign.json', 'tools/linux_build_policy.py', 'tests/test_linux_build_policy.py', 'benchmarks/linux_draw_campaign/**', 'tools/linux_draw_campaign.py', 'tools/port_linux_draw_campaign.py', 'tests/test_linux_draw_campaign.py', 'benchmarks/phase3_comparison/linux-draw-campaign.json', 'benchmarks/linux_pso_campaign/**', 'tools/linux_pso_campaign.py', 'tools/port_linux_pso_campaign.py', 'tests/test_linux_pso_campaign.py', 'benchmarks/phase3_comparison/linux-pso-campaign.json']
  pull_request:
    paths: ['.github/workflows/linux-comparison-probe.yml', 'benchmarks/linux_comparison/**', 'benchmarks/common/LinuxEnvironment.hpp', 'tools/linux_comparison.py', 'tests/test_linux_comparison.py', 'benchmarks/linux_workloads/**', 'tools/linux_workloads.py', 'tools/port_linux_benchmarks.py', 'tests/test_linux_workloads.py', 'tools/linux_workload_matrix.py', 'tests/test_linux_workload_matrix.py', 'benchmarks/linux_llgl_probe/**', 'tools/linux_llgl_probe.py', 'tests/test_linux_llgl_probe.py', 'benchmarks/linux_llgl_upload/**', 'tools/linux_llgl_upload.py', 'tools/port_linux_llgl_upload.py', 'tests/test_linux_llgl_upload.py', 'benchmarks/linux_llgl_draw/**', 'tools/linux_llgl_draw.py', 'tools/port_linux_llgl_draw.py', 'tests/test_linux_llgl_draw.py', 'benchmarks/linux_llgl_pso/**', 'tools/linux_llgl_pso.py', 'tools/port_linux_llgl_pso.py', 'tests/test_linux_llgl_pso.py', 'benchmarks/llgl_vulkan_*/**', 'benchmarks/vulkan_pso/Frame.hpp', 'benchmarks/phase3_comparison/pso.json', 'benchmarks/linux_llgl_allocation/**', 'tools/linux_llgl_allocation.py', 'tools/port_linux_llgl_allocation.py', 'tests/test_linux_llgl_allocation.py', 'benchmarks/vulkan_allocation/Payload.hpp', 'benchmarks/phase3_comparison/allocation.json', 'tools/linux_readiness_report.py', 'tests/test_linux_readiness_report.py', 'tools/linux_llgl_workload_mode.py', 'tests/test_linux_llgl_workload_mode.py', 'benchmarks/linux_upload_campaign/**', 'tools/linux_upload_campaign.py', 'tools/port_linux_upload_campaign.py', 'tests/test_linux_upload_campaign.py', 'benchmarks/phase3_comparison/linux-upload-campaign.json', 'tools/linux_build_policy.py', 'tests/test_linux_build_policy.py', 'benchmarks/linux_draw_campaign/**', 'tools/linux_draw_campaign.py', 'tools/port_linux_draw_campaign.py', 'tests/test_linux_draw_campaign.py', 'benchmarks/phase3_comparison/linux-draw-campaign.json', 'benchmarks/linux_pso_campaign/**', 'tools/linux_pso_campaign.py', 'tools/port_linux_pso_campaign.py', 'tests/test_linux_pso_campaign.py', 'benchmarks/phase3_comparison/linux-pso-campaign.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 3b2bc951500ca6a1f428af77e036e732d9a8afe3
          path: .deps/SDL
          persist-credentials: false
      - name: Prepare compiler and explicit software ICD
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build libvulkan1 mesa-vulkan-drivers libx11-dev libxrandr-dev libssl-dev
      - uses: actions/checkout@v4
        with:
          repository: LukasBanana/LLGL
          ref: 649c0cc8fa608312c5e4b94dae409a5859fc7553
          path: .deps/LLGL
          persist-credentials: false
      - name: Build pinned isolated VVL runtime
        run: python3 tools/prepare_linux_validation.py
      - name: Probe current SDK and pinned SDL without promoting software to hardware
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          icds=list(pathlib.Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          assert len(icds)==1
          subprocess.run(['python3','tools/linux_comparison.py','run','--controlled-build','--mode','software-diagnostic','--icd',str(icds[0]),'--runtime-receipt','out/linux-vulkan-validation-evidence/runtime/receipt.json','--output','out/linux-comparison-evidence'],check=True)
          r=json.loads(pathlib.Path('out/linux-comparison-evidence/receipt.json').read_text())
          assert r['status']=='completed' and not r['P3_BEN_07_completed'] and not r['physical_probe_qualified'] and not r['performance_accepted']
          subprocess.run(['python3','tools/linux_comparison.py','check','--output','out/linux-comparison-evidence','--live'],check=True)
          PY
      - name: Build and exercise four Linux workload consumers with required validation
        run: |
          python3 tools/linux_workloads.py run --mode software-diagnostic --qualification out/linux-comparison-evidence --output out/linux-workloads-evidence
          python3 tools/linux_workloads.py check --output out/linux-workloads-evidence --live
      - name: Build approved LLGL profile and verify native Linux software probes
        run: |
          python3 tools/linux_llgl_probe.py run --qualification out/linux-comparison-evidence --output out/linux-llgl-evidence
          python3 tools/linux_llgl_probe.py check --output out/linux-llgl-evidence --live
      - name: Verify all approved LLGL Linux upload inputs and core-sync controls
        run: |
          python3 tools/linux_llgl_upload.py run --probe out/linux-llgl-evidence --output out/linux-llgl-upload-evidence
          python3 tools/linux_llgl_upload.py check --output out/linux-llgl-upload-evidence --live
      - name: Verify approved LLGL Linux draw and instancing with native pass-through counters
        run: |
          python3 tools/linux_llgl_draw.py run --probe out/linux-llgl-evidence --output out/linux-llgl-draw-evidence
          python3 tools/linux_llgl_draw.py check --output out/linux-llgl-draw-evidence --live
      - name: Verify approved LLGL Linux PSO lifecycle and changing stripes
        run: |
          python3 tools/linux_llgl_pso.py run --probe out/linux-llgl-evidence --output out/linux-llgl-pso-evidence
          python3 tools/linux_llgl_pso.py check --output out/linux-llgl-pso-evidence --live
      - name: Verify approved LLGL Linux buffer and texture lifecycle with full resource payloads
        run: |
          python3 tools/linux_llgl_allocation.py run --probe out/linux-llgl-evidence --output out/linux-llgl-allocation-evidence
          python3 tools/linux_llgl_allocation.py check --output out/linux-llgl-allocation-evidence --live
      - name: Exercise every SDK and SDL workload case as software diagnostics
        run: |
          python3 tools/linux_workload_matrix.py run --readiness out/linux-workloads-evidence --output out/linux-workload-matrix
          python3 tools/linux_workload_matrix.py check --output out/linux-workload-matrix --live
      - name: Join same-revision three-SDK correctness and produce unexecuted physical handoff
        run: |
          python3 tools/linux_readiness_report.py collect --matrix out/linux-workload-matrix --upload out/linux-llgl-upload-evidence --draw out/linux-llgl-draw-evidence --pso out/linux-llgl-pso-evidence --allocation out/linux-llgl-allocation-evidence --output out/linux-readiness-report --live
          python3 tools/linux_readiness_report.py check --output out/linux-readiness-report --live
      - name: Build physical LLGL profile and prove software cannot qualify
        run: |
          python3 tools/linux_llgl_probe.py guard --mode physical --qualification out/linux-comparison-evidence --output out/linux-llgl-physical-guard
          python3 tools/linux_llgl_probe.py check --output out/linux-llgl-physical-guard --live
      - name: Build physical LLGL workload adapters and require all sixteen software rejections
        run: |
          for profile in upload draw pso allocation; do
            python3 "tools/linux_llgl_${profile}.py" guard --mode physical --probe out/linux-llgl-physical-guard --output "out/linux-llgl-${profile}-physical-guard"
            python3 "tools/linux_llgl_${profile}.py" check --output "out/linux-llgl-${profile}-physical-guard" --live
          done
      - name: Verify three-SDK upload timer and separated software smoke
        run: |
          python3 tools/linux_upload_campaign.py smoke --readiness out/linux-workloads-evidence --llgl-correctness out/linux-llgl-upload-evidence --output out/linux-upload-campaign-smoke
          python3 tools/linux_upload_campaign.py check --output out/linux-upload-campaign-smoke --live
      - name: Verify three-SDK draw intervals, native audits and separated software smoke
        run: |
          python3 tools/linux_draw_campaign.py smoke --readiness out/linux-workloads-evidence --llgl-correctness out/linux-llgl-draw-evidence --output out/linux-draw-campaign-smoke
          python3 tools/linux_draw_campaign.py check --output out/linux-draw-campaign-smoke --live
      - name: Verify three-SDK PSO intervals, native audits and separated software smoke
        run: |
          python3 tools/linux_pso_campaign.py smoke --readiness out/linux-workloads-evidence --llgl-correctness out/linux-llgl-pso-evidence --output out/linux-pso-campaign-smoke
          python3 tools/linux_pso_campaign.py check --output out/linux-pso-campaign-smoke --live
      - name: Preserve diagnostics without external binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-comparison-probe-${{ github.sha }}
          path: |
            out/linux-comparison-evidence/
            out/linux-vulkan-validation-evidence/runtime/
            out/linux-workloads-evidence/
            out/linux-workload-matrix/
            out/linux-llgl-evidence/
            out/linux-llgl-upload-evidence/
            out/linux-llgl-draw-evidence/
            out/linux-llgl-pso-evidence/
            out/linux-llgl-allocation-evidence/
            out/linux-readiness-report/
            out/linux-llgl-physical-guard/
            out/linux-llgl-upload-physical-guard/
            out/linux-llgl-draw-physical-guard/
            out/linux-llgl-pso-physical-guard/
            out/linux-llgl-allocation-physical-guard/
            out/linux-upload-campaign-smoke/
            out/linux-draw-campaign-smoke/
            out/linux-pso-campaign-smoke/
          if-no-files-found: error
          retention-days: 14
