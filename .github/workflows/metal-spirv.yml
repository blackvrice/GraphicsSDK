name: Metal SPIRV-Cross installed consumer
on:
  push:
    paths: &inputs
      - '.github/workflows/metal-spirv.yml'
      - 'tools/metal_spirv.py'
      - 'tools/shader_toolchain.py'
      - 'tools/shader_cache.py'
      - 'tools/shader-toolchain.lock.json'
      - 'tools/vulkan_spirv.py'
      - 'tools/d3d12_dxil.py'
      - 'tests/metal_spirv/**'
      - 'tests/fixtures/spirv_bindings/sample.spvasm'
      - 'benchmarks/reports/validation/2026-11-04-vulkan-spirv/**'
      - 'benchmarks/reports/validation/2026-11-04-d3d12-dxil/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GFX_METAL_SPIRV_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CMake and Ninja
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          if ! command -v ninja >/dev/null; then brew install ninja; fi
      - name: Convert validated SPIR-V, compile MSL and execute the installed Metal SDK
        run: python3 tools/metal_spirv.py run --output out/metal-spirv
      - name: Replay Metal controls and compare Vulkan and D3D12 images
        run: python3 tools/metal_spirv.py check --output out/metal-spirv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-spirv-${{ matrix.arch }}-${{ github.sha }}
          path: out/metal-spirv/
          if-no-files-found: error
