name: macOS Core and CPU contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CMake and Ninja
        run: |
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          if ! command -v ninja >/dev/null; then brew install ninja; fi
      - name: Build native Core, all CPU CTests and installed-only consumer
        run: python3 tools/macos_core.py run --architecture ${{ matrix.architecture }} --output out/macos-core-evidence
      - name: Survey native Metal devices and offline shader tools without GPU submission
        run: python3 tools/macos_metal_probe.py run --core out/macos-core-evidence --output out/macos-metal-evidence
      - name: Execute SDK Metal submission, resources, graphics and installed public consumers
        run: python3 tools/macos_metal_backend.py run --availability out/macos-metal-evidence --output out/macos-metal-backend-evidence
      - name: Build and run the installed Metal presentation consumer
        run: |
          set -euo pipefail
          output=out/macos-metal-presentation
          build=out/macos-metal-presentation-build
          mkdir "$output"
          cp tests/macos_metal_presentation/{CMakeLists.txt,Presentation.mm} "$output/"
          cmake -S tests/macos_metal_presentation -B "$build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/out/macos-metal-backend-evidence-install" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }} 2>&1 | tee "$output/configure.log"
          cmake --build "$build" --verbose 2>&1 | tee "$output/build.log"
          cp "$build/compile_commands.json" "$output/"
          lipo -archs "$build/metal_presentation" | tee "$output/architecture.txt"
          test "$(cat "$output/architecture.txt")" = '${{ matrix.architecture }}'
          "$build/metal_presentation" --contracts 2> >(tee "$output/contracts.stderr" >&2) | tee "$output/contracts.json"
          status=0
          "$build/metal_presentation" --runner-window 2> >(tee "$output/window.stderr" >&2) > "$output/window.json" || status=$?
          cat "$output/window.json"
          test "$status" -eq 0 || test "$status" -eq 77
          python3 - "$output" "$status" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          receipt = json.loads(pathlib.Path('out/macos-metal-backend-evidence/receipt.json').read_text())
          contracts = json.loads((out/'contracts.json').read_text())
          window = json.loads((out/'window.json').read_text())
          fingerprint = receipt['SDK_source_fingerprint']
          assert contracts == dict(contract='metal_layer_contracts_v1', SDK_source_fingerprint=fingerprint, presentation_executed=False)
          if sys.argv[2] == '0':
              assert window == dict(contract='metal_window_v1', SDK_source_fingerprint=fingerprint, frames=8,
                  before_resize_presented=window['before_resize_presented'], after_resize_presented=window['after_resize_presented'],
                  display_observed=window['display_observed'], native_control_frames=window['native_control_frames'],
                  native_control_presented=0,
                  presentation_executed=True, interactive=False)
              for key in ('before_resize_presented', 'after_resize_presented'):
                  assert type(window[key]) is int and 0 <= window[key] <= 4
              displayed = min(window['before_resize_presented'], window['after_resize_presented']) > 0
              assert window['display_observed'] is displayed
              assert window['native_control_frames'] == (0 if displayed else 3)
          else:
              assert window == dict(presentation_executed=False, reason='no AppKit screen')
          PY
      - name: Validate Metal API usage with native blit controls and installed SDK regressions
        run: |
          python3 tools/macos_metal_validation.py run \
            --backend out/macos-metal-backend-evidence \
            --presentation out/macos-metal-presentation-build/metal_presentation \
            --output out/macos-metal-validation
      - name: Run every Python contract without exclusions
        run: python3 tools/check_python_contracts.py --output out/macos-python
      - name: Bind native and Python evidence to the same source and architecture
        run: python3 tools/macos_core.py check --output out/macos-core-evidence --python out/macos-python --live
      - name: Bind Metal availability to the same native and tested source
        run: python3 tools/macos_metal_probe.py check --output out/macos-metal-evidence --python out/macos-python --live
      - name: Bind SDK Metal submission and full buffer/texture/draw payloads to the same tested source
        run: python3 tools/macos_metal_backend.py check --output out/macos-metal-backend-evidence --python out/macos-python --live
      - name: Replay saved native macOS matrix independently
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-macos-core/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-macos-core/verify.py
      - name: Replay saved Metal device and shader-tool availability
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-metal-availability/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-metal-availability/verify.py
      - name: Replay saved native SDK Metal submission and installed-consumer evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-metal-submission/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-metal-submission/verify.py
      - name: Replay saved Metal full buffer payloads, partial guards and lifetime evidence
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-metal-buffers/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-metal-buffers/verify.py
      - name: Replay saved Metal full texture payloads and color-depth clear-load passes
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-metal-textures/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-metal-textures/verify.py
      - name: Replay saved Metal graphics inputs, binding snapshots and full draw images
        if: ${{ hashFiles('benchmarks/reports/validation/2026-11-03-metal-graphics/verify.py') != '' }}
        run: python3 benchmarks/reports/validation/2026-11-03-metal-graphics/verify.py
      - name: Preserve diagnostics without system libraries or native binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-core-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            out/macos-core-evidence/
            out/macos-metal-evidence/
            out/macos-metal-backend-evidence/
            out/macos-metal-presentation/
            out/macos-metal-validation/
            out/macos-python/
          if-no-files-found: error
          retention-days: 14
