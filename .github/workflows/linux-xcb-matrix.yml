name: Linux XCB integrated output matrix
on:
  push:
    paths: ['include/**','src/**','CMakeLists.txt','tests/Bgra*','tests/fixtures/**','tests/VulkanValidationTests.cpp','tests/linux_xcb_*/**','examples/xcb_presentation/**','examples/presentation/PresentationPolicy.hpp','tools/run_linux_xcb_*.py','tools/xcb_window_manager.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','tools/vulkan-validation.lock.json','.github/workflows/linux-xcb-matrix.yml']
  pull_request:
    paths: ['include/**','src/**','CMakeLists.txt','tests/Bgra*','tests/fixtures/**','tests/VulkanValidationTests.cpp','tests/linux_xcb_*/**','examples/xcb_presentation/**','examples/presentation/PresentationPolicy.hpp','tools/run_linux_xcb_*.py','tools/xcb_window_manager.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','tools/vulkan-validation.lock.json','.github/workflows/linux-xcb-matrix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        validation: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build pkg-config libxcb1-dev libvulkan1 mesa-vulkan-drivers xvfb xauth openbox
      - name: Build pinned validation runtime with XCB support
        if: matrix.validation
        run: python3 tools/prepare_linux_validation.py --xcb
      - name: Build and install one shared SDK
        run: |
          cmake -S . -B out/wsi-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DGFX_ENABLE_D3D12=OFF -DGFX_ENABLE_VULKAN=ON -DGFX_VULKAN_XCB=ON -DGFX_BUILD_TESTS=OFF -DGFX_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/wsi-install"
          cmake --build out/wsi-sdk --parallel 1
          cmake --install out/wsi-sdk
      - name: Build installed consumers and example policy
        shell: bash
        run: |
          for suite in present lifetime resize events matrix; do
            cmake -S "tests/linux_xcb_$suite" -B "out/wsi-consumers/$suite" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/out/wsi-install"
            cmake --build "out/wsi-consumers/$suite" --parallel 1
          done
          ctest --test-dir out/wsi-consumers/events --output-on-failure
      - name: Integrated multi-window, image, lifetime, event and validation matrix
        env:
          REQUIRE_VALIDATION: ${{ matrix.validation }}
        shell: bash
        run: |
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json')
          test "${#icds[@]}" -eq 1
          flags=()
          if test "$REQUIRE_VALIDATION" = true; then
            layer=$(python3 -c 'import json;from pathlib import Path;r=json.load(open("out/linux-xcb-validation-evidence/runtime/receipt.json"));print(Path(r["layer_manifest"]["path"]).parent)')
            flags+=(--validation-dir "$layer")
          fi
          python3 tools/run_linux_xcb_campaign.py --consumer-root out/wsi-consumers --sdk-library out/wsi-install/lib/libGraphicsSDKCore.a --icd "${icds[0]}" --output out/wsi-evidence "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-xcb-matrix-${{ matrix.validation }}
          path: |
            out/wsi-evidence
            out/linux-xcb-validation-evidence
          if-no-files-found: warn
