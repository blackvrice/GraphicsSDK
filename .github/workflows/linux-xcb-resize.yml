name: Linux XCB resize and retirement controls
on:
  push:
    paths: ['include/**','src/**','CMakeLists.txt','tests/Bgra*','tests/linux_xcb_lifetime/**','tests/linux_xcb_resize/**','tests/linux_xcb_present/**','tests/linux_xcb_surface/**','tools/run_linux_xcb_present.py','tools/run_linux_xcb_lifetime.py','tools/run_linux_xcb_resize.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','.github/workflows/linux-xcb-resize.yml']
  pull_request:
    paths: ['include/**','src/**','CMakeLists.txt','tests/Bgra*','tests/linux_xcb_lifetime/**','tests/linux_xcb_resize/**','tests/linux_xcb_present/**','tests/linux_xcb_surface/**','tools/run_linux_xcb_present.py','tools/run_linux_xcb_lifetime.py','tools/run_linux_xcb_resize.py','tools/prepare_linux_validation.py','tools/linux-xcb-validation.json','.github/workflows/linux-xcb-resize.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        validation: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build pkg-config libxcb1-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Build pinned validation runtime with XCB support
        if: matrix.validation
        run: python3 tools/prepare_linux_validation.py --xcb
      - run: cmake -S . -B out/resize-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DGFX_ENABLE_D3D12=OFF -DGFX_ENABLE_VULKAN=ON -DGFX_VULKAN_XCB=ON -DGFX_BUILD_TESTS=OFF -DGFX_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/resize-install"
      - run: cmake --build out/resize-sdk --parallel 1 && cmake --install out/resize-sdk
      - run: cmake -S tests/linux_xcb_resize -B out/resize-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/out/resize-install" && cmake --build out/resize-consumer --parallel 1
      - name: Actual resize, pending submissions, status controls, failed recreation and retry
        env:
          REQUIRE_VALIDATION: ${{ matrix.validation }}
        shell: bash
        run: |
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json')
          test "${#icds[@]}" -eq 1
          flags=()
          if test "$REQUIRE_VALIDATION" = true; then
            layer=$(python3 -c 'import json;from pathlib import Path;r=json.load(open("out/linux-xcb-validation-evidence/runtime/receipt.json"));print(Path(r["layer_manifest"]["path"]).parent)')
            flags+=(--validation-dir "$layer")
          fi
          python3 tools/run_linux_xcb_resize.py --binary out/resize-consumer/gfx_xcb_resize --proxy out/resize-consumer/proxy/libvulkan.so.1 --sdk-library out/resize-install/lib/libGraphicsSDKCore.a --icd "${icds[0]}" --output out/resize-evidence "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-xcb-resize-${{ matrix.validation }}
          path: |
            out/resize-evidence
            out/linux-xcb-validation-evidence
          if-no-files-found: warn
