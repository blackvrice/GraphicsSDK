name: Linux Vulkan buffer contracts (software ICD)
on:
  push:
    paths:
      - '.github/workflows/linux-vulkan-transfer.yml'
      - 'tools/run_linux_transfer.py'
      - 'tools/run_linux_device.py'
      - 'tests/VulkanTests.cpp'
      - 'tests/vulkan_consumer/**'
      - 'tests/linux_vulkan_device/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  pull_request:
    paths:
      - '.github/workflows/linux-vulkan-transfer.yml'
      - 'tools/run_linux_transfer.py'
      - 'tools/run_linux_device.py'
      - 'tests/VulkanTests.cpp'
      - 'tests/vulkan_consumer/**'
      - 'tests/linux_vulkan_device/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-buffers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - name: Prepare native software Vulkan runtime
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Run buffer, queue, fence and lifetime contracts
        run: python3 tools/run_linux_transfer.py
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-vulkan-transfer-${{ github.sha }}
          path: out/linux-vulkan-transfer-evidence/
          if-no-files-found: error
          retention-days: 14
