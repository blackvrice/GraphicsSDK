name: Linux WSI scope (XCB prerequisites)
on:
  push:
    paths: ['.github/workflows/linux-wsi-scope.yml', 'tests/linux_wsi_scope/**', 'tools/run_linux_wsi_scope.py', 'tests/test_linux_wsi_scope.py']
  pull_request:
    paths: ['.github/workflows/linux-wsi-scope.yml', 'tests/linux_wsi_scope/**', 'tools/run_linux_wsi_scope.py', 'tests/test_linux_wsi_scope.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xcb-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .deps/Vulkan-Headers
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build pkg-config libxcb1-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - run: cmake -S . -B out/wsi-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DGFX_ENABLE_D3D12=OFF -DGFX_ENABLE_VULKAN=ON -DGFX_BUILD_TESTS=OFF -DGFX_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/wsi-install"
      - run: cmake --build out/wsi-sdk --parallel 1 && cmake --install out/wsi-sdk
      - run: cmake -S tests/linux_wsi_scope -B out/wsi-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/out/wsi-install" && cmake --build out/wsi-probe --parallel 1
      - name: Native XCB surface, queue, feature and display-negative observation
        shell: bash
        run: |
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json')
          test "${#icds[@]}" -eq 1
          python3 tools/run_linux_wsi_scope.py --binary out/wsi-probe/gfx_linux_wsi_scope --sdk-library out/wsi-install/lib/libGraphicsSDKCore.a --icd "${icds[0]}" --output out/wsi-scope-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-wsi-scope-evidence
          path: out/wsi-scope-evidence
          if-no-files-found: warn
