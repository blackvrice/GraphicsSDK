name: Linux comparison physical probe (manual)
on:
  workflow_dispatch:
    inputs:
      icd:
        description: Absolute installed physical GPU ICD manifest path
        required: true
        type: string
      device_uuid:
        description: Exact lowercase 32-digit native physical GPU UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  physical-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, graphicssdk-gpu]
    timeout-minutes: 60
    env:
      GFX_COMPARISON_ICD: ${{ inputs.icd }}
      GFX_COMPARISON_UUID: ${{ inputs.device_uuid }}
    defaults:
      run:
        working-directory: comparison-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: comparison-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: comparison-${{ github.run_id }}-${{ github.run_attempt }}/.deps/Vulkan-Headers
          clean: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 3b2bc951500ca6a1f428af77e036e732d9a8afe3
          path: comparison-${{ github.run_id }}-${{ github.run_attempt }}/.deps/SDL
          clean: false
          persist-credentials: false
      - name: Require explicit installed ICD and UUID
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          assert pathlib.Path(os.environ['GFX_COMPARISON_ICD']).is_file()
          assert re.fullmatch('[0-9a-f]{32}',os.environ['GFX_COMPARISON_UUID']) and int(os.environ['GFX_COMPARISON_UUID'],16)
          PY
      - uses: actions/checkout@v4
        with:
          repository: LukasBanana/LLGL
          ref: 649c0cc8fa608312c5e4b94dae409a5859fc7553
          path: comparison-${{ github.run_id }}-${{ github.run_attempt }}/.deps/LLGL
          clean: false
          persist-credentials: false
      - name: Build isolated pinned validation runtime
        run: python3 tools/prepare_linux_validation.py
      - name: Require physical SDK and SDL device probes with pinned validation
        run: |
          python3 tools/linux_comparison.py run --controlled-build --mode physical --icd "$GFX_COMPARISON_ICD" --device-uuid "$GFX_COMPARISON_UUID" --runtime-receipt out/linux-vulkan-validation-evidence/runtime/receipt.json --output out/linux-comparison-physical
          python3 tools/linux_comparison.py check --output out/linux-comparison-physical --live
      - name: Build and exercise qualified Linux workload consumers
        run: |
          python3 tools/linux_workloads.py run --mode physical --qualification out/linux-comparison-physical --output out/linux-workloads-physical
          python3 tools/linux_workloads.py check --output out/linux-workloads-physical --live
      - name: Qualify actual approved LLGL native GPU and minimal full buffer reference
        run: |
          python3 tools/linux_llgl_probe.py run --mode physical --qualification out/linux-comparison-physical --output out/linux-llgl-physical
          python3 tools/linux_llgl_probe.py check --output out/linux-llgl-physical --live
      - name: Verify all four LLGL workloads on the same qualified physical GPU
        run: |
          for profile in upload draw pso allocation; do
            python3 "tools/linux_llgl_${profile}.py" run --mode physical --probe out/linux-llgl-physical --output "out/linux-llgl-${profile}-physical"
            python3 "tools/linux_llgl_${profile}.py" check --output "out/linux-llgl-${profile}-physical" --live
          done
      - name: Collect fresh observer-free three-SDK upload repetitions
        run: |
          python3 tools/linux_upload_campaign.py run --readiness out/linux-workloads-physical --llgl-correctness out/linux-llgl-upload-physical --output out/linux-upload-campaign-physical
          python3 tools/linux_upload_campaign.py check --output out/linux-upload-campaign-physical --live
      - name: Collect fresh observer-free three-SDK draw repetitions
        run: |
          python3 tools/linux_draw_campaign.py run --readiness out/linux-workloads-physical --llgl-correctness out/linux-llgl-draw-physical --output out/linux-draw-campaign-physical
          python3 tools/linux_draw_campaign.py check --output out/linux-draw-campaign-physical --live
      - name: Collect fresh observer-free three-SDK PSO repetitions
        run: |
          python3 tools/linux_pso_campaign.py run --readiness out/linux-workloads-physical --llgl-correctness out/linux-llgl-pso-physical --output out/linux-pso-campaign-physical
          python3 tools/linux_pso_campaign.py check --output out/linux-pso-campaign-physical --live
      - name: Collect fresh observer-free three-SDK resource repetitions
        run: |
          python3 tools/linux_allocation_campaign.py run --readiness out/linux-workloads-physical --llgl-correctness out/linux-llgl-allocation-physical --output out/linux-allocation-campaign-physical
          python3 tools/linux_allocation_campaign.py check --output out/linux-allocation-campaign-physical --live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-comparison-physical-${{ github.sha }}-${{ github.run_id }}
          path: |
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-comparison-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-vulkan-validation-evidence/runtime/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-workloads-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-llgl-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-llgl-upload-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-llgl-draw-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-llgl-pso-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-llgl-allocation-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-upload-campaign-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-draw-campaign-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-pso-campaign-physical/
            comparison-${{ github.run_id }}-${{ github.run_attempt }}/out/linux-allocation-campaign-physical/
          if-no-files-found: error
          retention-days: 14
